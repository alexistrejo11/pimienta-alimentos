components:
  schemas:
    SupplierHeadquarterRequest:
      type: object
      properties:
        headquarterId:
          type: integer
          format: int64
          description: Headquarter served by this person.
          example: 1
        active:
          type: boolean
          description: Whether this person currently supplies the brand at the headquarter.
      required:
      - active
      - headquarterId
    UpsertSupplierRequest:
      type: object
      properties:
        name:
          type: string
          description: Person who supplies the brand.
          example: Juan Pérez
          maxLength: 200
          minLength: 0
        phone:
          type: string
          description: Phone number.
          example: "+528112345678"
          maxLength: 40
          minLength: 0
        brand:
          type: string
          description: Brand this person supplies.
          example: Marinela
          maxLength: 120
          minLength: 0
        headquarters:
          type: array
          description: "Headquarters this person supplies, and whether each one is\
            \ current."
          items:
            $ref: "#/components/schemas/SupplierHeadquarterRequest"
      required:
      - brand
      - headquarters
      - name
      - phone
    SupplierHeadquarterResponse:
      type: object
      properties:
        headquarterId:
          type: integer
          format: int64
          description: Headquarter served by this person.
          example: 1
        active:
          type: boolean
          description: Whether this person currently supplies the brand at the headquarter.
    SupplierResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Person who supplies the brand.
          example: Juan Pérez
        phone:
          type: string
          description: Phone number.
          example: "+528112345678"
        brand:
          type: string
          description: Brand this person supplies.
          example: Marinela
        headquarters:
          type: array
          items:
            $ref: "#/components/schemas/SupplierHeadquarterResponse"
    ApiErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        traceId:
          type: string
        context:
          type: object
          additionalProperties: {}
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 300
          minLength: 0
        description:
          type: string
          maxLength: 4000
          minLength: 0
        unit:
          type: string
          enum:
          - PIECE
          - KG
          - GRAM
          - LITER
          - ML
          - BOX
          - DOZEN
          - METER
          - SQUARE_METER
        barcode:
          type: string
          maxLength: 64
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - DISCONTINUED
        trackStock:
          type: boolean
      required:
      - name
      - status
      - unit
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        unit:
          type: string
          enum:
          - PIECE
          - KG
          - GRAM
          - LITER
          - ML
          - BOX
          - DOZEN
          - METER
          - SQUARE_METER
        barcode:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISCONTINUED
        trackStock:
          type: boolean
        inventoryItemId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    DeviceRenamePosProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 300
          minLength: 0
        barcode:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - name
    PosBootstrapProductResponse:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        saleCategory:
          type: string
        unit:
          type: string
        priceCentavos:
          type: integer
          format: int64
        costCentavos:
          type: integer
          format: int64
        available:
          type: boolean
        stockQuantity:
          type: integer
          format: int32
        stockMinQuantity:
          type: integer
          format: int32
        stockPolicy:
          type: string
    DeviceUpdatePosProductOfferRequest:
      type: object
      properties:
        salePriceCentavos:
          type: integer
          format: int64
          minimum: 1
        stockPolicy:
          type: string
          enum:
          - CONTROLLED
          - NOT_CONTROLLED
        saleCategory:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - salePriceCentavos
      - stockPolicy
    UpdatePosOperatorRequest:
      type: object
      properties:
        displayName:
          type: string
        posRole:
          type: string
          enum:
          - CASHIER
          - MANAGER
          - SUPERADMIN
        pin:
          type: string
          description: Write-only PIN; omit to keep current
        userId:
          type: integer
          format: int64
        active:
          type: boolean
        headquarterIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
    PosOperatorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        posRole:
          type: string
          enum:
          - CASHIER
          - MANAGER
          - SUPERADMIN
        userId:
          type: integer
          format: int64
        active:
          type: boolean
        headquarterIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
    UpsertOperatingExpenseRequest:
      type: object
      properties:
        headquarterId:
          type: integer
          format: int64
          description: Headquarter that owns the expense. Omitted only when the caller
            has exactly one assigned sede.
          example: 3
        amount:
          type: number
          description: "Amount in MXN, greater than zero."
          example: 185.5
          minimum: 0.01
        category:
          type: string
          description: Operating cost category. Payroll is not a valid value.
          enum:
          - SUPPLIERS_MERCHANDISE
          - RENT
          - UTILITIES
          - MAINTENANCE
          - SUPPLIES_PETTY_CASH
          - OTHER
          example: SUPPLIERS_MERCHANDISE
        concept:
          type: string
          description: Short description of the expense.
          example: Notas de caja
          maxLength: 200
          minLength: 0
        notes:
          type: string
          description: Optional notes.
          example: Compra de hielo
          maxLength: 500
          minLength: 0
        occurredOn:
          type: string
          format: date
          description: Business day. Restricted roles may only use today in America/Mexico_City.
          example: 2026-10-14
        retainAttachmentKeys:
          type: array
          description: "On update, keys to keep. Omit to keep every current receipt.\
            \ Empty list removes them all."
          items:
            type: string
      required:
      - amount
      - category
      - concept
    OperatingExpenseAttachmentResponse:
      type: object
      properties:
        key:
          type: string
          description: Private S3 object key.
        url:
          type: string
          description: Presigned GET URL valid for one hour.
    OperatingExpenseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        headquarterId:
          type: integer
          format: int64
        amount:
          type: number
        category:
          type: string
          enum:
          - SUPPLIERS_MERCHANDISE
          - RENT
          - UTILITIES
          - MAINTENANCE
          - SUPPLIES_PETTY_CASH
          - OTHER
        concept:
          type: string
        notes:
          type: string
        occurredOn:
          type: string
          format: date
        recordedByUserId:
          type: integer
          format: int64
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OperatingExpenseAttachmentResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    StorageLocationUpdateRequest:
