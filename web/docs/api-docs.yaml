    NotificationAdminSearchRequest:
      type: object
      description: Filters and pagination for admin notification search (GET /api/v1/notifications/management).
      properties:
        page:
          type: integer
          format: int32
          default: 0
          description: Índice de página basado en cero.
          example: 0
          minimum: 0
        size:
          type: integer
          format: int32
          default: 20
          description: Tamaño de página (máximo 100).
          example: 20
          maximum: 100
          minimum: 1
        id:
          type: string
          format: uuid
          description: Filter by notification id.
        channel:
          type: string
          description: Filter by channel.
          enum:
          - EMAIL
          - SMS
          - LOG
          example: EMAIL
        type:
          type: string
          description: Filter by type.
          enum:
          - ACCOUNT_PENDING_APPROVAL
          - UNDEFINED
          example: ACCOUNT_PENDING_APPROVAL
        status:
          type: string
          description: Filter by status.
          enum:
          - PENDING
          - SENT
          - FAILED
          - SKIPPED
          example: SENT
        recipientUserId:
          type: integer
          format: int64
          description: Filter by recipient user id.
          example: 1
        relatedUserId:
          type: integer
          format: int64
          description: Filter by related user id.
          example: 42
        correlationId:
          type: string
          description: Correlation id contains (case-insensitive).
          example: account-pending
        recipientEmailContains:
          type: string
          description: Recipient email contains (case-insensitive).
          example: admin@
        recipientPhoneContains:
          type: string
          description: Recipient phone contains.
          example: "300"
        subjectContains:
          type: string
          description: Subject contains (case-insensitive).
          example: approval
        bodyContains:
          type: string
          description: Body contains (case-insensitive).
          example: registered
        createdFrom:
          type: string
          format: date-time
          description: "Created at from (inclusive), ISO-8601."
          example: 2026-05-01T00:00:00
        createdTo:
          type: string
          format: date-time
          description: "Created at to (inclusive), ISO-8601."
          example: 2026-05-28T23:59:59
        sentFrom:
          type: string
          format: date-time
          description: "Sent at from (inclusive), ISO-8601."
          example: 2026-05-01T00:00:00
        sentTo:
          type: string
          format: date-time
          description: "Sent at to (inclusive), ISO-8601."
          example: 2026-05-28T23:59:59
    NotificationStatisticsRequest:
      type: object
      description: Time interval for notification statistics (GET .../management/statistics).
      properties:
        from:
          type: string
          format: date-time
          description: "Interval start (inclusive), ISO-8601 date-time."
          example: 2026-05-01T00:00:00
        to:
          type: string
          format: date-time
          description: "Interval end (inclusive), ISO-8601 date-time."
          example: 2026-05-28T23:59:59
      required:
      - from
      - to
    NotificationStatisticsResponse:
      type: object
      description: Aggregated notification metrics for a time interval.
      properties:
        from:
          type: string
          format: date-time
          description: Interval start (inclusive).
          example: 2026-05-01T00:00:00
        to:
          type: string
          format: date-time
          description: Interval end (inclusive).
          example: 2026-05-28T23:59:59
        total:
          type: integer
          format: int64
          description: Total notifications in the interval.
          example: 120
        pending:
          type: integer
          format: int64
          description: Pending count.
          example: 3
        sent:
          type: integer
          format: int64
          description: Successfully sent count.
          example: 110
        failed:
          type: integer
          format: int64
          description: Failed count.
          example: 5
        skipped:
          type: integer
          format: int64
          description: Skipped count.
          example: 2
        countByChannel:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Counts grouped by channel name.
          example:
            LOG: 80
            EMAIL: 30
        countByType:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Counts grouped by type name.
          example:
            ACCOUNT_PENDING_APPROVAL: 120
        countByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Counts grouped by status name.
          example:
            SENT: 110
            FAILED: 5
