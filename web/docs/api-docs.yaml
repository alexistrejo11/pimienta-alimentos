    AttendanceStartMultipartBody:
      type: object
      description: "Send as **multipart/form-data**: part **attendance** = JSON (**StartWorkdayRequest**),\
        \ optional part **checkInEvidencePhoto** = image file."
      properties:
        attendance:
          $ref: "#/components/schemas/StartWorkdayRequest"
          description: JSON payload; prefer Content-Type **application/json** on the
            part. The server also accepts UTF-8 JSON if the part is sent as generic
            binary.
        checkInEvidencePhoto:
          type: string
          format: binary
          description: Optional check-in evidence image (e.g. JPEG or PNG).
      required:
      - attendance
    StartWorkdayRequest:
      type: object
      description: "JSON part for check-in when using **multipart/form-data** (`attendance`\
        \ part), or full body for **application/json**. Evidence photos are uploaded\
        \ as the **`checkInEvidencePhoto`** multipart part only (not a URL field)."
      properties:
        headquarterId:
          type: integer
          format: int64
          description: Headquarter where the employee is clocking in.
          example: 3
        workDate:
          type: string
          format: date
          description: Optional calendar work date; defaults to today when omitted.
          example: 2026-05-14
      required:
      - headquarterId
    AttendanceResponse:
      type: object
      description: Single employee attendance record.
      properties:
        id:
          type: integer
          format: int64
          description: Primary key.
          example: 42
        employeeId:
          type: integer
          format: int64
          description: Employee id.
          example: 7
        employeeFullName:
          type: string
          description: Employee full name for display.
          example: María López
        headquarterId:
          type: integer
          format: int64
          description: Headquarter id.
          example: 3
        workDate:
          type: string
          format: date
          description: Calendar work date.
          example: 2026-05-14
        checkInTime:
          type: string
          format: date-time
          description: Check-in timestamp.
        checkOutTime:
          type: string
          format: date-time
          description: Check-out timestamp; null while still checked in.
        status:
          type: string
          description: Lifecycle status.
          enum:
          - UNDEFINED
          - CHECKED_IN
          - CHECKED_OUT
          - AUTO_CLOSED_EXCEEDED_MAX_SHIFT_HOURS
          - AUTO_CLOSED_ASSUMED_CONTRACT_DAY
        checkInEvidencePhotoUrl:
          type: string
          description: "Check-in evidence: **HTTPS presigned URL** when stored value\
            \ is an S3 object key; legacy rows may return a plain URL. Empty when\
            \ no photo was uploaded."
        checkOutEvidencePhotoUrl:
          type: string
          description: "Check-out evidence: **HTTPS presigned URL** when stored value\
            \ is an S3 object key; legacy rows may return a plain URL. Empty when\
            \ no photo was uploaded."
        minutesWorked:
          type: integer
          format: int64
          description: Minutes between check-in and check-out (0 if open).
          example: 480
    AttendanceEndMultipartBody:
      type: object
