    UpdateContractRequest:
      type: object
      description: "Misma forma y reglas que el alta (**CreateContractRequest**):\
        \ actualización completa del estado expuesto por la API. Requiere `Authorization:\
        \ Bearer <token>`."
      properties:
        name:
          type: string
          description: Nombre o título del contrato.
          example: Contrato suministro materias primas 2025 (enmienda 1)
          minLength: 1
        description:
          type: string
          description: Descripción libre; puede omitirse.
          example: Acuerdo marco con proveedor homologado — anexo logística.
        category:
          type: string
          description: "Tipo de contrato: EMPLOYEE, SUPPLIER, CUSTOMER, PARTNER, OTHER."
          enum:
          - EMPLOYEE
          - SUPPLIER
          - CUSTOMER
          - PARTNER
          - OTHER
          - UNDEFINED
          example: SUPPLIER
        employeeId:
          type: integer
          format: int64
          description: Empleado vinculado; obligatorio si `category` es EMPLOYEE.
          example: 101
        termKind:
          type: string
          description: "Plazo: FIXED_TERM o INDEFINITE."
          enum:
          - FIXED_TERM
          - INDEFINITE
          - UNDEFINED
          example: FIXED_TERM
        effectiveStart:
          type: string
          format: date
          description: Inicio de vigencia (ISO-8601 date).
          example: 2025-05-01
        effectiveEnd:
          type: string
          format: date
          description: Fin de vigencia (FIXED_TERM); omitir en INDEFINITE.
          example: 2026-10-31
        documentUrl:
          type: string
          description: URL del documento firmado o archivo archivado.
          example: https://storage.example.com/contracts/sup-2025-001-v2.pdf
          minLength: 1
        termsAndConditions:
          type: string
          description: Términos y condiciones (opcional).
          example: Pago a 45 días a partir de recepción de factura.
        referenceCode:
          type: string
          description: Código de referencia (opcional).
          example: CT-SUP-2025-042-R1
        renewalCycleMonths:
          type: integer
          format: int32
          description: Meses entre renovaciones automáticas (FIXED_TERM).
          example: 12
          minimum: 1
        agreedValue:
          type: number
          description: Valor pactado (opcional).
          example: 275000.0
          minimum: 0
        currencyCode:
          type: string
          description: Moneda ISO 4217 si hay valor pactado.
          example: MXN
          maxLength: 3
          minLength: 3
      required:
      - category
      - documentUrl
      - effectiveStart
      - name
      - termKind
    ContractResponse:
      type: object
      description: Representación de un contrato de negocio. Los textos opcionales
        nunca son `null` en JSON (cadena vacía). `category` o `termKind` pueden mostrar
        **UNDEFINED** si faltan en almacenamiento legado.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador persistido; 0 o ausente antes de guardar en borradores.
          example: 42
        name:
          type: string
          description: Nombre o título del contrato.
          example: Contrato suministro 2025
        description:
          type: string
          description: Descripción.
          example: Acuerdo marco con proveedor homologado.
        category:
          type: string
          description: "Categoría: EMPLOYEE, SUPPLIER, CUSTOMER, PARTNER, OTHER, o\
            \ UNDEFINED si no hay dato."
          enum:
          - EMPLOYEE
          - SUPPLIER
          - CUSTOMER
          - PARTNER
          - OTHER
          - UNDEFINED
          example: SUPPLIER
        employeeId:
          type: integer
          format: int64
          description: Empleado vinculado (solo EMPLOYEE).
          example: 101
        termKind:
          type: string
          description: "Tipo de plazo: FIXED_TERM, INDEFINITE, o UNDEFINED si no hay\
            \ dato."
          enum:
          - FIXED_TERM
          - INDEFINITE
          - UNDEFINED
          example: FIXED_TERM
        effectiveStart:
          type: string
          format: date
          description: Inicio de vigencia.
          example: 2025-05-01
        effectiveEnd:
          type: string
          format: date
          description: Fin de vigencia (null si indefinido o sin fin en modelo).
          example: 2026-04-30
        documentUrl:
          type: string
          description: URL del documento firmado o archivo.
          example: https://storage.example.com/contracts/sup-2025-001.pdf
        termsAndConditions:
          type: string
          description: Términos y condiciones.
          example: Pago a 30 días.
        referenceCode:
          type: string
          description: Código de referencia.
          example: CT-SUP-2025-042
        agreedValue:
          type: number
          description: Valor pactado (puede ser null).
          example: 250000.0
        currencyCode:
          type: string
          description: Moneda ISO 4217; cadena vacía si no aplica.
          example: MXN
        renewalCycleMonths:
          type: integer
          format: int32
          description: Meses de ciclo para renovación automática.
          example: 12
          minimum: 1
        extensionCount:
          type: integer
          format: int32
          description: Número de renovaciones o prórrogas registradas.
          example: 2
          minimum: 0
        lastRenewedAt:
          type: string
          format: date-time
          description: Marca de tiempo de la última renovación o extensión.
          example: 2026-01-15T10:30:00
        createdAt:
          type: string
          format: date-time
          description: Creación (audit).
        updatedAt:
          type: string
          format: date-time
          description: Última actualización (audit).
    ExtendContractRequest:
