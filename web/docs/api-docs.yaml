openapi: 3.1.0
info:
  title: Pimienta Alimentos API
  description: "REST API for Pimienta Alimentos. Most endpoints require a Bearer JWT\
    \ access token. Role claims are exposed as Spring authorities `ROLE_<NAME>` (e.g.\
    \ `ROLE_ADMIN`, `ROLE_MANAGER`)."
  contact:
    name: Pimienta Alimentos
    url: https://github.com/alexistrejo11/pimienta
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: POS Admin Reports
  description: Read-only POS reports over ACCEPTED facts (staff JWT).
- name: Operations — OperatingExpenses
  description: "Operating expenses (gastos operativos) with optional receipt images.\
    \ ADMIN and DIRECTOR have full access. MANAGER and EMPLOYEE can list and create\
    \ only for today at an assigned sede. Create and update use multipart: JSON part\
    \ `data` and optional file part `attachments`."
- name: Account — User management
  description: "Administrative APIs under `/api/v1/users/management`. **Requires**\
    \ `Authorization: Bearer  <access_token>`. Supported account roles include `ROLE_ADMIN`,\
    \ `ROLE_DIRECTOR`, `ROLE_MANAGER`,  `ROLE_SALES`, `ROLE_EMPLOYEE`, `ROLE_SUPPORT`,\
    \ and baseline `ROLE_USER`. for operators; fine-grained authorization may be enforced\
    \ in the application layer as the product evolves."
- name: Account — Profile
  description: "Current-user profile and dashboard. Requires `Authorization: Bearer\
    \ <access_token>`. JWT must map to a valid user; roles are exposed as `ROLE_*`\
    \ authorities."
- name: Authentication
  description: Registration and session endpoints. **Register** and **login** are
    public (no Bearer token). **Refresh** and **logout** are also reachable without
    an `Authorization` header in this configuration; they use the refresh token carried
    in the JSON body where applicable.
- name: POS Device Sync
  description: "Device JWT sync endpoints: bootstrap, changes, and events."
- name: POS Admin Sync Incidents
  description: List and accept POS sync review incidents (accept is ADMIN only).
- name: Notification management
  description: Administrator APIs for searching stored notifications and viewing delivery
    statistics. Requires JWT with **ROLE_ADMIN**.
- name: POS Admin Shifts
  description: List and inspect POS shifts (turnos). Date filters apply to closedAt
    for CLOSED shifts and openedAt for OPEN shifts.
- name: POS App Releases
  description: Public Android POS APK download metadata (CI-published to S3).
- name: Headquarters — POS products
  description: "Creates a global sellable product and the headquarter catalog row\
    \ in one call. Staff JWT with access to the headquarter (ADMIN, DIRECTOR, MANAGER,\
    \ EMPLOYEE)."
- name: Inventory — dashboard
  description: "KPIs agregados de existencias y conteos físicos. Requiere Bearer JWT.\
    \ Lectura: ADMIN, DIRECTOR, MANAGER, EMPLOYEE."
- name: Operations — Headquarters
  description: "Company sites / branches: CRUD, lookup by id or name, statistics,\
    \ and Excel import/export. Requires `Authorization: Bearer <access_token>`. Reads\
    \ are available to authenticated staff; create, update, soft-delete, and import\
    \ require **ROLE_ADMIN**. Not-found responses use `HEADQUARTER_NOT_FOUND` in `ApiErrorResponse`."
- name: File management
  description: "Administrator API for uploading, searching, deleting, and downloading\
    \ company files stored in S3 (pimienta/sources/). Requires JWT with **ROLE_ADMIN**."
- name: Inventory — transactions
  description: "Movimientos de inventario (compra, venta, transferencia, ajustes,\
    \ flujo de aprobación). Requiere Bearer JWT. Errores: `INVENTORY_TRANSACTION_NOT_FOUND`,\
    \ `INVENTORY_TRANSACTION_INVALID_STATE`, validaciones de negocio."
- name: POS Admin Operators
  description: Staff CRUD for POS operators.
- name: POS Telemetry
  description: POS health snapshots and operational activity.
- name: HR — Employees
  description: "Employee lifecycle: search, registration, updates, contract submission,\
    \ termination/rehire, Excel import/export, and statistics. Requires `Authorization:\
    \ Bearer <access_token>`. Reads are available to authenticated staff; create/update/delete/import\
    \ and lifecycle mutations require **ROLE_ADMIN**. Not-found responses use `EMPLOYEE_NOT_FOUND`\
    \ in `ApiErrorResponse`."
- name: Operations — Tasks
  description: "Work items: search, CRUD, status and assignment updates, checklist\
    \ toggles, and Excel import/export. Requires `Authorization: Bearer <access_token>`.\
    \ Typical roles: **MANAGER**, **ADMIN**, **SUPPORT** (as configured). Not-found\
    \ responses may use `TASK_NOT_FOUND` or `TASK_CHECKLIST_ITEM_NOT_FOUND` in `ApiErrorResponse`."
- name: Health
  description: "Public liveness checks. No authentication required; intended for load\
    \ balancers, container orchestrators, and uptime monitors."
- name: HR — Employee attendance
  description: "Check-in / check-out for employees, queries by id, by headquarter\
    \ for the current day, paginated search, and automatic closure of forgotten open\
    \ attendances (scheduled job). Photo fields accept caller-managed URLs. Requires\
    \ `Authorization: Bearer <access_token>` unless this environment still permits\
    \ the employees route for testing."
- name: Operations — Suppliers
  description: "People who supply a brand (name, phone, brand), with an active flag\
    \ per headquarter. Requires staff JWT. OPS roles: ADMIN, DIRECTOR, MANAGER, EMPLOYEE."
- name: Contracts
  description: "Business agreements (employment, supplier, customer, …). Requires\
    \ `Authorization: Bearer <access_token>`. Typical operators: **ADMIN**, **MANAGER**.\
    \ An employee id is validated when supplied. Domain rules may return `CONTRACT_NOT_FOUND`\
    \ or validation errors (`errorCode` in `ApiErrorResponse`)."
- name: Inventory — storage locations
  description: "Ubicaciones de almacén (árbol, bloqueo). Requiere Bearer JWT. Errores:\
    \ `STORAGE_LOCATION_NOT_FOUND`, `STORAGE_LOCATION_NOT_EMPTY`."
- name: Notification logs
  description: Manager-facing read-only log of today's LOG-channel notifications.
    Requires JWT with **ROLE_MANAGER** or **ROLE_ADMIN**.
- name: Inventory — movements
  description: "Historial de movimientos de stock (consulta). Requiere Bearer JWT.\
    \ **404**: `INVENTORY_MOVEMENT_NOT_FOUND`. Rate limit clase: **STANDARD**; lecturas:\
    \ **READ_HEAVY**."
- name: Payroll
  description: Payroll management and reporting endpoints.
- name: Products
  description: Sale catalog. SKU is assigned by the database.
- name: HR — Employee work schedule
  description: "Weekly work schedule stored on the employee record (JSON). **GET**\
    \ returns the configured slots (possibly empty). **PUT** replaces the entire schedule.\
    \ Requires `Authorization: Bearer <access_token>` unless this environment still\
    \ permits the employees route for testing."
- name: Inventory — stock
  description: "Existencias por artículo y ubicación. Requiere Bearer JWT. Errores\
    \ típicos: `INVENTORY_NOT_FOUND`, `INVENTORY_ALREADY_EXISTS`, `ITEM_NOT_FOUND`,\
    \ `STORAGE_LOCATION_NOT_FOUND`."
- name: POS Admin Enrollment
  description: One-time device enrollment codes.
- name: Headquarters — POS settings
  description: "Per-headquarter POS operational config (currency, catalog stale thresholds,\
    \ open-amount categories, default negative stock limit). Staff JWT. Upsert also\
    \ ensures the canonical POS storage location (`POS-{id}`)."
- name: POS Device Auth
  description: "Device enrollment, refresh, and identity."
- name: Inventory — items
  description: "Catálogo de artículos (SKU, categoría, estado). Requiere `Authorization:\
    \ Bearer <access_token>`. Operadores típicos: **ADMIN**, **MANAGER**. Errores\
    \ de dominio devuelven `ApiErrorResponse` (p. ej. `ITEM_NOT_FOUND`, `ITEM_SKU_ALREADY_EXISTS`)."
- name: POS Admin Devices
  description: List and revoke POS tablets.
- name: Headquarters — POS catalog
  description: "Effective POS catalog (`headquarter_items`) per headquarter: sale\
    \ category, sale price, availability, stock policy. Staff JWT. Global item master\
    \ remains under `/api/v1/inventory/items`."
- name: POS Telemetry Ingest
  description: Device-authenticated POS diagnostic batches.
- name: File resources
  description: Module-scoped file upload and retrieval (RESOURCE category). Requires
    JWT with **ROLE_ADMIN** or **ROLE_MANAGER**.
- name: Web Telemetry
  description: Authenticated browser diagnostic events for Loki.
