              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: "Unauthorized: missing/invalid Bearer token, bad credentials,\
            \ or expired access token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: "Forbidden: authenticated but not allowed for this resource."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Too many requests (rate limit). Check `Retry-After` and `X-RateLimit-*`
            response headers.
