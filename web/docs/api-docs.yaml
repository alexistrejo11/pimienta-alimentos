          example: "012180001234567890"
          maxLength: 18
          minLength: 0
        employeeNumber:
          type: string
          description: Internal employee number (optional).
          example: EMP-1042
          maxLength: 32
          minLength: 0
        position:
          type: string
          description: Job title (optional).
          example: Operador de línea
          maxLength: 120
          minLength: 0
        department:
          type: string
