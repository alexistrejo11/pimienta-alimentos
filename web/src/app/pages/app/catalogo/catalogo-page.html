<div class="flex flex-col gap-6 p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <app-page-header
      title="Catálogo maestro"
      subtitle="Productos del inventario central para surtir en sedes POS"
    />
    <a
      routerLink="/app/catalogo/nuevo"
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary shadow-md transition hover:opacity-95"
    >
      <span class="material-symbols-outlined mr-1 text-lg" aria-hidden="true">add</span>
      Nuevo producto
    </a>
  </div>

  <app-data-state
    [loading]="loading()"
    [error]="error()"
    [empty]="items().length === 0"
    emptyMessage="No hay productos en el catálogo maestro."
    (retry)="cargar()"
  >
    <div class="overflow-x-auto rounded-xl border border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-950">
      <table class="w-full text-sm" aria-label="Catálogo maestro">
        <thead class="border-b border-stone-100 bg-stone-50 dark:border-stone-800 dark:bg-stone-900">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">SKU</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Nombre</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Categoría</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Precio venta</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Estado</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
          @for (item of items(); track item.id) {
            <tr>
              <td class="px-4 py-3 font-mono text-xs">{{ item.sku }}</td>
              <td class="px-4 py-3">{{ item.name }}</td>
              <td class="px-4 py-3 text-on-surface-variant">{{ item.category }}</td>
              <td class="px-4 py-3 tabular-nums">{{ formatMoney(item.salePrice) }}</td>
              <td class="px-4 py-3">{{ item.status }}</td>
              <td class="px-4 py-3 text-right">
                <a
                  [routerLink]="['/app/catalogo', item.id, 'editar']"
                  class="text-sm font-semibold text-primary hover:underline"
                >
                  Editar
                </a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>
</div>
