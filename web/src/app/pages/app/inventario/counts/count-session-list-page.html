<div class="mx-auto flex max-w-5xl flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <app-page-header title="Conteos físicos" subtitle="Auditoría con captura ciega y aprobación administrativa" />
    <a routerLink="/app/ops/inventario/conteos/nuevo" class="inline-flex min-h-11 items-center rounded-lg bg-primary px-4 py-2.5 font-bold text-on-primary">Nuevo conteo</a>
  </div>

  <app-headquarter-select class="max-w-xs" label="Sede" [value]="selectedHeadquarterId" (valueChange)="onHeadquarterChange($event)" />

  <app-data-state [loading]="loading()" [error]="error()" [empty]="sessions().length === 0" emptyMessage="No hay sesiones de conteo." (retry)="cargar()">
    <div class="ui-panel rounded-xl">
      <div class="responsive-table overflow-x-auto rounded-xl">
      <table class="w-full text-sm">
        <thead class="bg-surface-container-low">
          <tr>
            <th class="px-4 py-3 text-left">Sesión</th>
            <th class="px-4 py-3 text-left">Ubicación</th>
            <th class="px-4 py-3 text-left">Tipo</th>
            <th class="px-4 py-3 text-left">Estado</th>
            <th class="px-4 py-3 text-right">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/15">
          @for (session of sessions(); track session.id) {
            <tr>
              <td class="px-4 py-3 font-semibold">#{{ session.id }}</td>
              <td class="px-4 py-3">{{ session.locationId }}</td>
              <td class="px-4 py-3">{{ inventoryCountTypeLabel(session.type) }}</td>
              <td class="px-4 py-3">{{ inventoryCountStatusLabel(session.status) }}</td>
              <td class="px-4 py-3 text-right">
                <a class="inline-flex min-h-11 items-center font-semibold text-primary" [routerLink]="['/app/ops/inventario/conteos', session.id]">Abrir</a>
              </td>
            </tr>
          }
        </tbody>
      </table>
      </div>
    </div>
  </app-data-state>
</div>
