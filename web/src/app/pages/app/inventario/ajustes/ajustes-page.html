<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header title="Ajustes" subtitle="Ajuste directo de existencias — solo administradores" />

  @if (error()) {
    <p class="rounded-lg bg-primary-fixed p-3 text-sm text-on-primary-fixed">{{ error()?.message }}</p>
  }
  @if (success()) {
    <p class="rounded-lg bg-accent-container p-3 text-sm text-on-accent">{{ success() }}</p>
  }

  <section class="ui-panel max-w-2xl rounded-xl p-6">
    <div class="grid gap-4 sm:grid-cols-2">
      <app-item-select class="sm:col-span-2" [value]="itemId" (valueChange)="onItemChange($event)" />
      <label class="flex flex-col gap-1 text-sm sm:col-span-2">
        <span class="font-semibold">Ubicación</span>
        <select class="rounded-lg bg-surface-container px-3 py-2.5" [(ngModel)]="locationId">
          <option [ngValue]="null">Selecciona…</option>
          @for (loc of locations(); track loc.id) {
            <option [ngValue]="loc.id">{{ loc.code }} · {{ loc.name }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-semibold">Nueva cantidad absoluta</span>
        <input class="rounded-lg bg-surface-container px-3 py-2.5" type="number" min="0" [(ngModel)]="newQuantity" />
      </label>
      <label class="flex flex-col gap-1 text-sm sm:col-span-2">
        <span class="font-semibold">Motivo</span>
        <input class="rounded-lg bg-surface-container px-3 py-2.5" [(ngModel)]="reason" />
      </label>
    </div>
    <button type="button" class="mt-6 rounded-lg bg-primary px-4 py-2.5 font-bold text-on-primary" [disabled]="loading()" (click)="ajustar()">
      Aplicar ajuste
    </button>
  </section>
</div>
