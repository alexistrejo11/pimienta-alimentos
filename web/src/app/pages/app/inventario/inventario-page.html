<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    title="Existencias"
    subtitle="Consulta de stock por sede y ubicación (solo lectura)"
  />

  <div class="flex flex-wrap gap-4">
    <app-headquarter-select
      class="max-w-xs"
      label="Sede"
      [value]="selectedHeadquarterId"
      (valueChange)="onHeadquarterChange($event)"
    />
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-semibold text-on-surface-variant">Ubicación</span>
      <select
        class="rounded-lg bg-surface-container px-3 py-2.5"
        [value]="selectedLocationId ?? ''"
        (change)="onLocationChange($event)"
      >
        <option value="">Todas las ubicaciones</option>
        @for (loc of locations(); track loc.id) {
          <option [value]="loc.id">{{ loc.code }} · {{ loc.name }}</option>
        }
      </select>
    </label>
  </div>

  <app-data-state
    [loading]="loading()"
    [error]="error()"
    [empty]="stock().length === 0"
    emptyMessage="No hay existencias registradas para este filtro."
    (retry)="cargarStock()"
  >
    <div class="responsive-table rounded-xl border ui-panel">
      <table class="w-full text-sm" aria-label="Existencias">
        <thead class="border-b border-outline-variant/20 bg-surface-container-low">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">SKU</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Producto</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Ubicación</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Disponible</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/15">
          @for (row of stock(); track row.id) {
            <tr>
              <td class="px-4 py-3 font-mono text-xs">{{ row.itemSku }}</td>
              <td class="px-4 py-3">{{ row.itemName }}</td>
              <td class="px-4 py-3 text-on-surface-variant">{{ row.locationCode }}</td>
              <td class="px-4 py-3 tabular-nums font-semibold">{{ row.availableQuantity }}</td>
              <td class="px-4 py-3">{{ row.status }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>
</div>
