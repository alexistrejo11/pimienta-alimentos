<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    title="Mermas (OUT)"
    subtitle="Bajas autorizadas de inventario HQ (distinto del reporte operativo POS)"
  />

  <app-headquarter-select class="max-w-xs" label="Sede" [value]="selectedHeadquarterId" (valueChange)="onHeadquarterChange($event)" />

  @if (error()) {
    <p class="rounded-lg bg-primary-fixed p-3 text-sm text-on-primary-fixed">{{ error()?.message }}</p>
  }
  @if (success()) {
    <p class="rounded-lg bg-accent-container p-3 text-sm text-on-accent">{{ success() }}</p>
  }

  <section class="ui-panel max-w-2xl rounded-xl p-6">
    <div class="grid gap-4 sm:grid-cols-2">
      <app-item-select
        class="sm:col-span-2"
        [value]="itemId"
        (valueChange)="onItemChange($event)"
        (itemChange)="onItemPicked($event)"
      />
      <label class="flex flex-col gap-1 text-sm sm:col-span-2">
        <span class="font-semibold">Ubicación</span>
        <select class="rounded-lg bg-surface-container px-3 py-2.5" [(ngModel)]="locationId">
          <option [ngValue]="null">Selecciona…</option>
          @for (loc of locations(); track loc.id) {
            <option [ngValue]="loc.id">{{ loc.code }} · {{ loc.name }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-semibold">Cantidad</span>
        <input class="rounded-lg bg-surface-container px-3 py-2.5" type="number" min="1" [(ngModel)]="quantity" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-semibold">Costo unitario</span>
        <input class="rounded-lg bg-surface-container px-3 py-2.5" type="number" min="0" step="0.01" [(ngModel)]="unitCost" />
      </label>
      <label class="flex flex-col gap-1 text-sm sm:col-span-2">
        <span class="font-semibold">Motivo de salida</span>
        <select class="rounded-lg bg-surface-container px-3 py-2.5" [(ngModel)]="exitReason">
          @for (r of exitReasons; track r) {
            <option [ngValue]="r">{{ exitReasonLabel(r) }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm sm:col-span-2">
        <span class="font-semibold">Detalle (opcional)</span>
        <input class="rounded-lg bg-surface-container px-3 py-2.5" [(ngModel)]="detailNotes" />
      </label>
    </div>
    <button type="button" class="mt-6 rounded-lg bg-primary px-4 py-2.5 font-bold text-on-primary" [disabled]="loading()" (click)="registrar()">
      Registrar merma
    </button>
  </section>
</div>
