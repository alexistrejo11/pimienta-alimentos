<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header title="Transferencias internas" subtitle="Mueve existencias entre ubicaciones autorizadas" />
  <section class="ui-panel max-w-3xl p-6">
    <app-api-form-error [error]="error()" />
    @if (success()) {
      <p class="mb-4 rounded-lg bg-accent-container px-3 py-2 text-sm text-on-accent">{{ success() }}</p>
    }
    <app-headquarter-select
      label="Sede"
      mode="single"
      [value]="headquarterId()"
      (valueChange)="onHeadquarterChange($event)"
    />
    <form class="mt-4 grid gap-4 sm:grid-cols-2" (ngSubmit)="submit()">
      <app-item-select
        class="sm:col-span-2"
        [value]="itemId"
        (valueChange)="onItemChange($event)"
        (itemChange)="onItemPicked($event)"
      />
      <label class="flex flex-col gap-1 text-sm">
        <span>Ubicación origen</span>
        <select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="fromLocationId"
          name="fromLocationId"
          required
        >
          <option [ngValue]="0">Seleccionar origen</option>
          @for (location of locations(); track location.id) {
            <option [ngValue]="location.id">{{ location.name }} · {{ location.code }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span>Ubicación destino</span>
        <select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="toLocationId"
          name="toLocationId"
          required
        >
          <option [ngValue]="0">Seleccionar destino</option>
          @for (location of locations(); track location.id) {
            <option [ngValue]="location.id">{{ location.name }} · {{ location.code }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span>Cantidad</span>
        <input
          type="number"
          min="1"
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="quantity"
          name="quantity"
          required
        />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span>Costo unitario</span>
        <input
          type="number"
          min="0"
          step="0.01"
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="unitCost"
          name="unitCost"
          required
        />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span>Referencia externa</span>
        <input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="externalReference"
          name="externalReference"
        />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span>Notas</span>
        <input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          [(ngModel)]="notes"
          name="notes"
        />
      </label>
      <button
        type="submit"
        class="rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary sm:col-span-2"
        [disabled]="saving()"
      >
        {{ saving() ? 'Registrando…' : 'Registrar transferencia' }}
      </button>
    </form>
  </section>
</div>
