<section class="flex min-h-screen w-full items-center justify-center p-6 lg:p-10">
  <div class="ui-panel w-full max-w-3xl space-y-5 p-8 text-center">
    <span class="material-symbols-outlined text-5xl text-primary" aria-hidden="true">pending_actions</span>
    <h1 class="font-headline text-3xl font-extrabold text-on-surface">Cuenta pendiente de aprobación</h1>
    <p class="text-on-surface-variant">Un administrador debe aprobar tu cuenta y asignar tus roles antes de habilitar el workspace.</p>
    <div class="flex flex-wrap items-center justify-center gap-3">
      <a routerLink="/" class="inline-flex rounded-lg bg-primary px-5 py-3 font-bold text-on-primary">Volver al inicio</a>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg border border-outline-variant px-5 py-3 font-bold text-on-surface disabled:opacity-60"
        [disabled]="loggingOut()"
        (click)="cerrarSesion()"
      >
        <span class="material-symbols-outlined text-xl" aria-hidden="true">logout</span>
        {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </div>
  </div>
</section>
