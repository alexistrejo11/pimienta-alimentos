<div class="flex flex-col gap-6 p-8">
  <app-page-header title="Ventas POS" subtitle="Tickets aceptados por sede y periodo" />

  <div class="flex flex-wrap gap-3">
    @if (isAdmin()) {
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium">Sede</span>
        <select class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2" [(ngModel)]="selectedHeadquarterId">
          @for (sede of sedes(); track sede.id) {
            <option [ngValue]="sede.id">{{ sede.name }}</option>
          }
        </select>
      </label>
    }
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Desde</span>
      <input type="date" class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2" [(ngModel)]="dateFrom" />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Hasta</span>
      <input type="date" class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2" [(ngModel)]="dateTo" />
    </label>
    <button type="button" class="self-end rounded-lg bg-primary px-4 py-2 text-sm font-bold text-on-primary" (click)="cargar()">
      Consultar
    </button>
  </div>

  <app-data-state [loading]="loading()" [error]="error()" [empty]="sales().length === 0" emptyMessage="Sin ventas en el periodo." (retry)="cargar()">
    <div class="overflow-x-auto rounded-xl border ui-panel">
      <table class="w-full text-sm">
        <thead class="border-b border-outline-variant/20 bg-surface-container-low">
          <tr>
            <th class="px-4 py-3 text-left">Folio</th>
            <th class="px-4 py-3 text-left">Fecha</th>
            <th class="px-4 py-3 text-left">Total</th>
            <th class="px-4 py-3 text-left">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/15">
          @for (s of sales(); track s.saleId) {
            <tr>
              <td class="px-4 py-3 font-mono">{{ s.folio }}</td>
              <td class="px-4 py-3">{{ s.occurredAt | date: 'short' }}</td>
              <td class="px-4 py-3 tabular-nums">{{ formatCentavos(s.totalCentavos) }}</td>
              <td class="px-4 py-3">{{ s.status }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>
</div>
