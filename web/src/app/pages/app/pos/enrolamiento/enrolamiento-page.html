<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    title="Enrolamiento"
    subtitle="Genera un código de un solo uso (válido 10 minutos) para registrar una tablet"
  />

  <app-api-form-error [error]="error()" />

  <section class="max-w-lg ui-panel p-6">
    <app-headquarter-select
      class="mb-4 block max-w-xs"
      label="Sede"
      [value]="selectedHeadquarterId"
      (valueChange)="onHeadquarterChange($event)"
    />

    <button
      type="button"
      class="rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary disabled:opacity-60"
      [disabled]="generating() || selectedHeadquarterId == null"
      (click)="emitir()"
    >
      {{ generating() ? 'Generando…' : 'Emitir código' }}
    </button>

    @if (lastCode(); as code) {
      <div
        class="mt-6 rounded-lg border border-green-200 bg-green-50 p-4 dark:border-green-900/40 dark:bg-green-950/30"
      >
        <p class="text-sm text-on-surface-variant">Código para {{ hqName(code.headquarterId) }}</p>
        <p class="font-headline mt-2 text-3xl font-bold tracking-widest text-on-surface">
          {{ code.code }}
        </p>
        <p class="mt-2 text-xs text-on-surface-variant">
          Expira: {{ formatExpiry(code.expiresAt) }}
        </p>
      </div>
    }
  </section>
</div>
