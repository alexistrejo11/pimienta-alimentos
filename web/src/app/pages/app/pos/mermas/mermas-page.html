<div class="flex flex-col gap-6 p-8">
  <app-page-header title="Mermas y cancelaciones" subtitle="Eventos de inventario POS aceptados" />

  <div class="flex flex-wrap gap-3">
    <app-headquarter-select
      class="min-w-[12rem]"
      label="Sede"
      [value]="selectedHeadquarterId"
      (valueChange)="onHeadquarterChange($event)"
    />
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Desde</span>
      <input type="date" class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2" [(ngModel)]="dateFrom" />
    </label>
    <label class="flex flex-col gap-1 text-sm">
      <span class="font-medium">Hasta</span>
      <input type="date" class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2" [(ngModel)]="dateTo" />
    </label>
    <button type="button" class="self-end rounded-lg bg-primary px-4 py-2 text-sm font-bold text-on-primary" (click)="cargar()">Consultar</button>
  </div>

  <app-data-state [loading]="loading()" [error]="error()" [empty]="events().length === 0" emptyMessage="Sin mermas en el periodo." (retry)="cargar()">
    <div class="overflow-x-auto rounded-xl border ui-panel">
      <table class="w-full text-sm">
        <thead class="border-b border-outline-variant/20 bg-surface-container-low">
          <tr>
            <th class="px-4 py-3 text-left">Tipo</th>
            <th class="px-4 py-3 text-left">Fecha</th>
            <th class="px-4 py-3 text-left">Detalle</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/15">
          @for (e of events(); track e.eventId) {
            <tr>
              <td class="px-4 py-3">{{ e.eventType }}</td>
              <td class="px-4 py-3">{{ e.occurredAt | date: 'short' }}</td>
              <td class="px-4 py-3 font-mono text-xs">{{ e.payload | json }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>
</div>
