<div class="flex flex-col gap-6 p-8">
  <app-page-header
    title="Incidencias de sincronización"
    subtitle="Eventos pendientes de revisión (solo administradores pueden aceptar)"
  />

  <app-data-state
    [loading]="loading()"
    [error]="error()"
    [empty]="incidents().length === 0"
    emptyMessage="No hay incidencias abiertas."
    (retry)="cargar()"
  >
    <div class="overflow-x-auto rounded-xl border border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-950">
      <table class="w-full text-sm">
        <thead class="border-b border-stone-100 bg-stone-50 dark:border-stone-800 dark:bg-stone-900">
          <tr>
            <th class="px-4 py-3 text-left">Sede</th>
            <th class="px-4 py-3 text-left">Motivo</th>
            <th class="px-4 py-3 text-left">Detalle</th>
            <th class="px-4 py-3 text-left">Creada</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
          @for (inc of incidents(); track inc.id) {
            <tr>
              <td class="px-4 py-3">#{{ inc.headquarterId }}</td>
              <td class="px-4 py-3">{{ inc.reasonCode }}</td>
              <td class="px-4 py-3 max-w-xs truncate">{{ inc.detail }}</td>
              <td class="px-4 py-3">{{ inc.createdAt | date: 'short' }}</td>
              <td class="px-4 py-3 text-right">
                <button type="button" class="text-sm font-semibold text-primary" (click)="select(inc)">Aceptar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>

  @if (selectedId(); as id) {
    <form class="max-w-md rounded-xl border border-stone-200 bg-white p-4 dark:border-stone-800 dark:bg-stone-950" [formGroup]="acceptForm" (ngSubmit)="accept(id)">
      <h2 class="font-semibold">Aceptar incidencia</h2>
      <div class="mt-3 flex flex-col gap-3">
        <label class="flex flex-col gap-1 text-sm">
          <span>Etiqueta</span>
          <input class="rounded-lg border border-stone-300 px-3 py-2 dark:border-stone-700 dark:bg-stone-950" formControlName="label" />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span>Nota (obligatoria)</span>
          <textarea rows="3" class="rounded-lg border border-stone-300 px-3 py-2 dark:border-stone-700 dark:bg-stone-950" formControlName="note"></textarea>
        </label>
        <button type="submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-bold text-on-primary" [disabled]="acceptingId() === id">
          Confirmar aceptación
        </button>
      </div>
    </form>
  }
</div>
