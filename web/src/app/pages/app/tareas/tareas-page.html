<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <app-page-header title="Tareas" subtitle="Seguimiento de tareas personales y de trabajo" />
    <a
      routerLink="/app/erp/tareas/nueva"
      class="inline-flex shrink-0 items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary shadow-md transition hover:opacity-95"
    >
      Nueva tarea
    </a>
  </div>

  <app-data-state
    [loading]="loading()"
    [error]="error()"
    [empty]="tareas().length === 0"
    emptyMessage="No hay tareas registradas."
    (retry)="cargar()"
  >
    <div class="responsive-table rounded-xl border ui-panel">
      <table class="w-full text-sm" aria-label="Lista de tareas">
        <thead class="border-b border-outline-variant/20 bg-surface-container-low">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Título</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Estado</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Prioridad</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Progreso</th>
            <th class="px-4 py-3 text-left font-semibold text-on-surface-variant">Vencimiento</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/15">
          @for (tarea of tareas(); track tarea.id) {
            <tr app-tarea-row [tarea]="tarea"></tr>
          }
        </tbody>
      </table>
    </div>
  </app-data-state>
</div>
