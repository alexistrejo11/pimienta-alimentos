<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    title="Nueva tarea"
    subtitle="Operación POST /api/v1/tasks (TaskRequest)."
    backLink="/app/erp/tareas"
    backLabel="Tareas"
  />

  <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
    <app-api-form-error [error]="apiError()" />

    <section class="ui-panel p-6">
      <h2 class="font-headline mb-4 text-base font-bold text-on-surface">Datos principales</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="sm:col-span-2 space-y-1.5">
          <label
            class="ml-1 block text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant"
            for="task-title"
            >Titulo</label
          >
          <input
            id="task-title"
            formControlName="title"
            type="text"
            class="w-full rounded-lg border border-transparent bg-surface-container px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary/20"
          />
          @if (form.controls.title.touched && form.controls.title.hasError('required')) {
            <p class="ml-1 text-xs text-[var(--color-error)]">Requerido.</p>
          }
          @if (apiFieldMessage('title'); as m) {
            <p class="ml-1 text-xs text-[var(--color-error)]">{{ m }}</p>
          }
        </div>

        <div class="sm:col-span-2 space-y-1.5">
          <label
            class="ml-1 block text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant"
            for="task-desc"
            >Descripcion</label
          >
          <textarea
            id="task-desc"
            formControlName="description"
            rows="3"
            class="w-full rounded-lg border border-transparent bg-surface-container px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary/20"
          ></textarea>
        </div>

        <div class="space-y-1.5">
          <label
            class="ml-1 block text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant"
            for="task-priority"
            >Prioridad</label
          >
          <select
            id="task-priority"
            formControlName="priority"
            class="w-full rounded-lg border border-transparent bg-surface-container px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary/20"
          >
            @for (p of priorities; track p) {
              <option [value]="p">{{ priorityLabel[p] }}</option>
            }
          </select>
        </div>

        <div class="space-y-1.5">
          <label
            class="ml-1 block text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant"
            for="task-due"
            >Fecha limite</label
          >
          <input
            id="task-due"
            formControlName="dueDate"
            type="datetime-local"
            class="w-full rounded-lg border border-transparent bg-surface-container px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary/20"
          />
        </div>
      </div>
    </section>

    <section class="ui-panel p-6">
      <h2 class="font-headline mb-4 text-base font-bold text-on-surface">Relacion y checklist</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <app-headquarter-select
          label="Sede (opcional)"
          [allowAll]="true"
          [value]="form.controls.headquarterId.value"
          (valueChange)="onHeadquarterChange($event)"
        />
        <app-project-select
          label="Proyecto (opcional)"
          [value]="form.controls.projectId.value"
          (valueChange)="form.controls.projectId.setValue($event)"
        />
        <app-opportunity-select
          label="Oportunidad (opcional)"
          [value]="form.controls.opportunityId.value"
          (valueChange)="form.controls.opportunityId.setValue($event)"
        />
        <app-employee-select
          label="Creador (opcional)"
          nullLabel="Sin asignar"
          [value]="form.controls.createdById.value"
          (valueChange)="form.controls.createdById.setValue($event)"
        />
        <div class="sm:col-span-2 space-y-1.5">
          <label
            class="ml-1 block text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant"
            for="task-checklist"
            >Checklist (una linea por item)</label
          >
          <textarea
            id="task-checklist"
            formControlName="checklistText"
            rows="5"
            placeholder="Llamar proveedor&#10;Confirmar costo&#10;Enviar resumen"
            class="w-full rounded-lg border border-transparent bg-surface-container px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary/20"
          ></textarea>
        </div>
      </div>
    </section>

    <div class="flex flex-wrap items-center gap-3">
      <button
        type="submit"
        class="rounded-lg bg-primary px-5 py-2.5 text-sm font-bold text-on-primary shadow-md transition hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="saving()"
      >
        @if (saving()) {
          Guardando...
        } @else {
          Crear tarea
        }
      </button>
      <a
        routerLink="/app/erp/tareas"
        class="rounded-lg border border-outline-variant/30 px-5 py-2.5 text-sm font-semibold text-on-surface transition hover:bg-surface-container"
      >
        Cancelar
      </a>
    </div>
  </form>
</div>
