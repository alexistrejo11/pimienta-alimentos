<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    title="Nuevo producto para POS"
    subtitle="El SKU se genera automáticamente al guardar"
    [backLink]="'/app/sedes/' + headquarterId() + '/pos'"
    backLabel="Catálogo POS"
  />
  @if (error(); as err) {
    <div
      role="alert"
      class="rounded-lg bg-red-50 p-4 text-sm text-red-900 dark:bg-red-950/40 dark:text-red-100"
    >
      {{ err.message }}
    </div>
  }
  <form class="ui-panel grid max-w-3xl gap-5 p-6" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="flex flex-col gap-1 text-sm sm:col-span-2"
        ><span class="font-medium">Nombre</span
        ><input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="name"
      /></label>
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Categoría de venta</span
        ><select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="posSaleCategoryId"
        >
          <option [value]="0">Selecciona una categoría</option>
          @for (c of categories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select></label
      >
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Tipo de producto</span
        ><select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="stockPolicy"
          (change)="setPrepared($any($event.target).value === 'NOT_CONTROLLED')"
        >
          <option value="NOT_CONTROLLED">Preparado al momento</option>
          <option value="CONTROLLED">Empaquetado / inventariable</option>
        </select></label
      >
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Precio de venta</span
        ><input
          type="number"
          step="0.01"
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="salePrice"
      /></label>
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Costo</span
        ><input
          type="number"
          step="0.01"
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="costPrice"
      /></label>
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium"
          >Barcode de proveedor <span class="text-on-surface-variant">(opcional)</span></span
        ><input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="barcode"
          placeholder="Ej. 7501030419389"
        /><small class="text-on-surface-variant"
          >Si queda vacío, podrás imprimir una etiqueta con el SKU interno.</small
        ></label
      >
      <div
        class="flex flex-col justify-center gap-1 rounded-lg bg-surface-container-low p-3 text-sm"
      >
        <span class="font-medium">SKU interno</span
        ><span class="font-headline text-lg font-bold text-primary"
          >Se generará como CAF-000001</span
        ><small class="text-on-surface-variant"
          >También podrá usarse para buscar y escanear etiquetas propias.</small
        >
      </div>
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Unidad</span
        ><select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="unit"
        >
          @for (u of units; track u) {
            <option [value]="u">{{ u }}</option>
          }
        </select></label
      >
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium">Categoría de inventario</span
        ><select
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="category"
        >
          @for (c of inventoryCategories; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select></label
      >
      <label class="flex flex-col gap-1 text-sm"
        ><span class="font-medium"
          >Marca <span class="text-on-surface-variant">(opcional)</span></span
        ><input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="brand"
      /></label>
      <label class="flex items-center gap-2 text-sm"
        ><input type="checkbox" formControlName="available" /> Disponible para venta</label
      >
    </div>
    <label class="flex flex-col gap-1 text-sm"
      ><span class="font-medium"
        >Descripción <span class="text-on-surface-variant">(opcional)</span></span
      ><textarea
        rows="2"
        class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
        formControlName="description"
      ></textarea>
    </label>
    <div class="flex gap-3">
      <button
        type="submit"
        class="rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary disabled:opacity-60"
        [disabled]="loading() || loadingCategories()"
      >
        {{ loading() ? 'Guardando…' : 'Crear producto' }}</button
      ><a
        [routerLink]="['/app/sedes', headquarterId(), 'pos']"
        class="rounded-lg border border-outline-variant/30 px-4 py-2.5 text-sm font-semibold"
        >Cancelar</a
      >
    </div>
  </form>
</div>
