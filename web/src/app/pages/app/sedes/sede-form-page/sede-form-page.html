<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <app-page-header
    [title]="isEdit ? 'Editar sede' : 'Nueva sede'"
    subtitle="Nombre, dirección y notas de la ubicación"
    backLink="/app/ops/sedes"
    backLabel="Sedes"
  />

  @if (loadingExisting()) {
    <p class="text-sm text-on-surface-variant">Cargando sede…</p>
  } @else {
    @if (apiError(); as err) {
      <div
        role="alert"
        class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-900 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-100"
      >
        {{ err.message }}
      </div>
    }

    <form class="flex max-w-2xl flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium text-on-surface"
          >Nombre <span class="text-[var(--color-error)]">*</span></span
        >
        <input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="name"
          autocomplete="organization"
          maxlength="512"
        />
        @if (form.controls.name.touched && form.controls.name.hasError('required')) {
          <span class="text-xs text-[var(--color-error)]">El nombre es obligatorio.</span>
        }
        @if (apiFieldMessage('name'); as m) {
          <span class="text-xs text-[var(--color-error)]">{{ m }}</span>
        }
      </label>

      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium text-on-surface">Dirección</span>
        <input
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          formControlName="address"
          autocomplete="street-address"
          maxlength="1024"
          placeholder="Opcional"
        />
        @if (apiFieldMessage('address'); as m) {
          <span class="text-xs text-[var(--color-error)]">{{ m }}</span>
        }
      </label>

      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium text-on-surface">Descripción</span>
        <textarea
          class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
          rows="3"
          formControlName="description"
          maxlength="4096"
          placeholder="Opcional"
        ></textarea>
        @if (apiFieldMessage('description'); as m) {
          <span class="text-xs text-[var(--color-error)]">{{ m }}</span>
        }
      </label>

      <div class="flex flex-wrap gap-3 pt-2">
        <button
          type="submit"
          [disabled]="loading()"
          class="inline-flex items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-on-primary shadow-md transition hover:opacity-95 disabled:opacity-60"
        >
          @if (loading()) {
            Guardando…
          } @else if (isEdit) {
            Guardar cambios
          } @else {
            Crear sede
          }
        </button>
        <a
          routerLink="/app/ops/sedes"
          class="inline-flex items-center justify-center rounded-lg border border-outline-variant/20 px-4 py-2.5 text-sm font-semibold text-on-surface transition hover:bg-surface-container"
        >
          Cancelar
        </a>
      </div>
    </form>
  }
</div>
