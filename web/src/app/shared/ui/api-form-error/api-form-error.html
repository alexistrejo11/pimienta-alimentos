@if (error(); as err) {
  <div
    role="alert"
    class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-900 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-100"
  >
    <p class="font-semibold">{{ message(err) }}</p>
    @if (err.fieldErrors.length > 0) {
      <ul class="mt-2 list-disc space-y-1 pl-5">
        @for (fe of err.fieldErrors; track fe.field + fe.message) {
          <li><span class="font-medium">{{ fe.field }}</span>: {{ fe.message }}</li>
        }
      </ul>
    }
    @if (err.traceId) {
      <p class="mt-2 text-xs opacity-75">Referencia: {{ err.traceId }}</p>
    }
  </div>
}
