@if (loading()) {
  <p class="text-sm text-on-surface-variant">Cargando clientes…</p>
} @else {
  <label class="flex flex-col gap-1 text-sm">
    <span class="font-medium">{{ label() }}</span>
    <select
      class="rounded-lg border border-outline-variant/30 bg-surface-container px-3 py-2"
      [disabled]="disabled()"
      [ngModel]="value()"
      (ngModelChange)="onChange($event)"
    >
      @if (allowNull()) {
        <option [ngValue]="null">{{ nullLabel() }}</option>
      }
      @for (c of options(); track c.id) {
        <option [ngValue]="c.id">{{ optionLabel(c) }}</option>
      }
    </select>
  </label>
}
