# Local development only. Values are hardcoded so backend/.env (prod) is never interpolated.
#   docker compose up --build
# Prod-like local run (homelab networks + .env): docker compose -f docker-compose.prod.yml up --build
name: pimienta-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pimienta_alimentos
      POSTGRES_USER: pimienta_dba
      POSTGRES_PASSWORD: pimienta_dba
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - pimienta_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/ensure-role.sh:/ensure-role.sh:ro
    entrypoint: ["/bin/sh", "/ensure-role.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pimienta-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - pimienta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pimienta-net

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_BUCKET_NAME: pimienta-employees
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - pimienta_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pimienta-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8027:8027"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      API_PORT: "8027"
      POSTGRES_DB: pimienta_alimentos
      POSTGRES_USER: pimienta_dba
      POSTGRES_PASSWORD: pimienta_dba
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pimienta_alimentos
      REDIS_URL: redis://redis:6379
      PIMIENTA_REDIS_KEY_PREFIX: pimienta-alimentos
      PIMIENTA_CORS_ALLOWED_ORIGINS: http://localhost:4000,http://localhost:4001,http://localhost:3000,http://127.0.0.1:4000,http://127.0.0.1:4001,http://127.0.0.1:3000,https://pimienta-alimentos.com,https://api.pimienta-alimentos.com
      PIMIENTA_SECURITY_JWT_SECRET: change-me-use-at-least-256-bits-for-hs256-secret-key-pimienta
      PIMIENTA_BOOTSTRAP_ADMIN_ENABLED: "true"
      PIMIENTA_BOOTSTRAP_ADMIN_EMAIL: marcoalexispt.02@gmail.com
      PIMIENTA_BOOTSTRAP_ADMIN_PASSWORD: adminadmin1
      PIMIENTA_BOOTSTRAP_ADMIN_FIRST_NAME: Alexis
      PIMIENTA_BOOTSTRAP_ADMIN_LAST_NAME: Perez
      PIMIENTA_BOOTSTRAP_ADMIN_PHONE: "+520000000001"
      JAVA_OPTS: ""
      AWS_REGION: us-east-1
      AWS_S3_FOLDER: employees
      AWS_S3_SOURCES_ROOT: pimienta/sources
      AWS_S3_POS_APK_KEY: pimienta/releases/pos/android/latest.apk
      AWS_S3_POS_APK_MANIFEST_KEY: pimienta/releases/pos/android/current.json
      AWS_S3_BUCKET_NAME: pimienta-employees
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
    volumes:
      - ./src:/workspace/src
      - ./pom.xml:/workspace/pom.xml
      - pimienta_m2:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - pimienta-net

volumes:
  pimienta_pg_data:
  pimienta_redis_data:
  pimienta_localstack_data:
  pimienta_m2:

networks:
  pimienta-net:
    external: true
