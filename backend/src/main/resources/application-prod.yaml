# Profile: prod — Flyway migrations, schema validate, real AWS S3, tight actuator.
spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    metrics:
      enabled: false
  info:
    java:
      enabled: false

logging:
  level:
    org.springframework.web: INFO
