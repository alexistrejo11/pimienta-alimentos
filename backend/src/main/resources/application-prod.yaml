# Profile: prod — Flyway migrations, schema validate, real AWS S3, tight actuator.
# Actuator listens on management.server.port (default 8081), not API_PORT.
# Do not publish 8081. An equal management port does not isolate Actuator.
spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    metrics:
      enabled: false
    prometheus:
      enabled: true
  info:
    java:
      enabled: false

pimienta:
  cors:
    allowed-origins: ${PIMIENTA_CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.web: INFO
