spring:
  application:
    name: pimienta
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
    git:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Pimienta Alimentos backend API

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
    default-model-expand-depth: 3
    default-models-expand-depth: 3

pimienta:
  redis:
    key-prefix: ${PIMIENTA_REDIS_KEY_PREFIX:pimienta-alimentos}
  bootstrap:
    admin:
      enabled: ${PIMIENTA_BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${PIMIENTA_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${PIMIENTA_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${PIMIENTA_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
      last-name: ${PIMIENTA_BOOTSTRAP_ADMIN_LAST_NAME:Pimienta}
      phone: ${PIMIENTA_BOOTSTRAP_ADMIN_PHONE:+520000000001}
  notifications:
    admin-emails: ${PIMIENTA_NOTIFICATIONS_ADMIN_EMAILS:admin@example.com}
  image:
    max-width: 800
    max-height: 600
    quality: 0.8
    allowed-formats: jpg, jpeg, png
  rate-limiting:
    enabled: true
  cors:
    path-pattern: "/**"
    # Comma-separated env value is split in CorsConfig. Do not use a trailing slash.
    allowed-origins: ${PIMIENTA_CORS_ALLOWED_ORIGINS:http://localhost:4000,http://localhost:4001,http://localhost:3000,http://127.0.0.1:4000,http://127.0.0.1:4001,http://127.0.0.1:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
      - Content-Type
      - X-Total-Count
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Limit-Endpoint
      - X-RateLimit-Remaining-Endpoint
      - Retry-After
    allow-credentials: true
    max-age-seconds: 3600
  security:
    jwt:
      secret: ${PIMIENTA_SECURITY_JWT_SECRET:change-me-use-at-least-256-bits-for-hs256-secret-key-pimienta}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
    device-jwt:
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 90
      refresh-token-max-ttl-days: 365

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}
    folder: ${AWS_S3_FOLDER:employees}
    sources-root: ${AWS_S3_SOURCES_ROOT:pimienta/sources}
    pos-apk-key: ${AWS_S3_POS_APK_KEY:pimienta/releases/pos/android/latest.apk}
    pos-apk-manifest-key: ${AWS_S3_POS_APK_MANIFEST_KEY:pimienta/releases/pos/android/current.json}
    endpoint: "${AWS_S3_ENDPOINT:}"
    public-endpoint: "${AWS_S3_PUBLIC_ENDPOINT:}"

logging:
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: backend
        source: application
  level:
    org.springframework.web: INFO
