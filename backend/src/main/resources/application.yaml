spring:
  application:
    name: pimienta
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      enabled: true
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
    git:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Pimienta Alimentos backend API

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
    default-model-expand-depth: 3
    default-models-expand-depth: 3

pimienta:
  redis:
    key-prefix: ${PIMIENTA_REDIS_KEY_PREFIX:pimienta-alimentos}
  notifications:
    admin-emails: ${PIMIENTA_NOTIFICATIONS_ADMIN_EMAILS:admin@example.com}
  image:
    max-width: 800
    max-height: 600
    quality: 0.8
    allowed-formats: jpg, jpeg, png
  rate-limiting:
    enabled: true
  cors:
    path-pattern: "/**"
    allowed-origins: ${PIMIENTA_CORS_ALLOWED_ORIGINS}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
      - Content-Type
      - X-Total-Count
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Limit-Endpoint
      - X-RateLimit-Remaining-Endpoint
      - Retry-After
    allow-credentials: true
    max-age-seconds: 3600
  security:
    jwt:
      secret: ${PIMIENTA_SECURITY_JWT_SECRET:change-me-use-at-least-256-bits-for-hs256-secret-key-pimienta}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}
    folder: ${AWS_S3_FOLDER:employees}
    sources-root: ${AWS_S3_SOURCES_ROOT:pimienta/sources}
    endpoint: "${AWS_S3_ENDPOINT:}"
    public-endpoint: "${AWS_S3_PUBLIC_ENDPOINT:}"

logging:
  level:
    org.springframework.web: INFO
