spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# Same key as any explicit hibernate.dialect — needed so JSON columns are not emitted as jsonb against H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# No Redis in tests: skip Boot Redis auto-config and this app's prefixed template.
# Refresh tokens use InMemoryRefreshTokenStore; rate limiting stays off.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,io.github.alexistrejo11.pimienta.config.redis.PimientaRedisAutoConfiguration
management.health.redis.enabled=false
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
pimienta.rate-limiting.enabled=false

# AWS (S3 beans load in tests; no real calls without photo upload + credentials)
aws.region=us-east-1
aws.s3.bucket=test-bucket
aws.s3.folder=test-employees
aws.s3.endpoint=
aws.s3.public-endpoint=