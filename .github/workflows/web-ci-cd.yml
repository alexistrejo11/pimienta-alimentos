# CI/CD for the Angular web app.
#
# Flow:
#   1) test     — install + unit tests + production build (PRs and main).
#   2) publish  — build & push image to GHCR (main only, after test passes).
#   3) deploy   — SSH to the VPS → pull THIS image, recreate the container,
#                 remove ONLY unused images for this project.
#
# Required GitHub secrets:
#   SSH_HOST           — VPS address (IP or hostname)
#   SSH_USER           — Linux user on the VPS
#   SSH_PRIVATE_KEY    — Full private key (same key you use locally)
#   WEB_DEPLOY_PATH    — Absolute path to compose dir, e.g. /home/alexistrejo/homelab/deploys/apps/pimienta_alimentos
#   GHCR_TOKEN         — GitHub PAT with read:packages (server pull from ghcr.io)
#
# Server layout (homelab compose, not web/docker-compose.yml in this repo):
#   $WEB_DEPLOY_PATH/docker-compose.yml  (service name: web)

name: Web CI-CD

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci-cd.yml"

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/web

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests + production build (must pass before publish/deploy)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build Angular project
        run: npm run build

  # ---------------------------------------------------------------------------
  # Login, build and push Docker image to ghcr.io
  # ---------------------------------------------------------------------------
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy — Direct SSH via Host IP
  # ---------------------------------------------------------------------------
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}/web
          DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${DEPLOY_PATH}" ] || [ -z "${GHCR_TOKEN}" ]; then
            echo "Missing required secrets. Ensure SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, WEB_DEPLOY_PATH, and GHCR_TOKEN are defined." >&2
            exit 1
          fi

          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"

          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            "export GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") GHCR_USER=$(printf '%q' "$GHCR_USER") IMAGE=$(printf '%q' "$IMAGE") DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH"); bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          docker compose pull web
          docker compose up -d --remove-orphans web

          # Safe cleanup: only unused images for THIS project
          echo "Cleaning unused images for $IMAGE..."
          docker images "$IMAGE" --format '{{.ID}}' | sort -u | while read -r id; do
            if [ -z "$(docker ps -aq --filter "ancestor=${id}")" ]; then
              docker rmi "$id" 2>/dev/null || true
            fi
          done

          docker logout ghcr.io || true
          echo "Deploy finished successfully."
          REMOTE
